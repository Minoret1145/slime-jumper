<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Slime Jumper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Comfortaa:wght@600;700;800&display=swap" rel="stylesheet">
    
    <!-- Firebase v8 SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Comfortaa', cursive, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #05060a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 100%;
            max-height: 920px;
            background: linear-gradient(180deg, #0b0d1b 0%, #040508 100%);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Верхняя панель (скрыта по умолчанию до входа) */
        .top-bar {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
            pointer-events: none;
        }

        .top-bar.hidden {
            display: none !important;
        }

        .user-badge {
            background: rgba(18, 22, 38, 0.88);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 242, 254, 0.35);
            border-radius: 20px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .user-role {
            font-size: 0.62rem;
            color: #ff3366;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: block;
            font-weight: 800;
        }

        .stats-group {
            display: flex;
            gap: 8px;
        }

        .stat-chip {
            background: rgba(18, 22, 38, 0.88);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 8px 12px;
            font-weight: 700;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .verified-icon {
            background: #00f2fe;
            color: #000;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            font-size: 10px;
            font-weight: 900;
        }

        /* Экраны */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8, 10, 18, 0.95);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        .game-title {
            font-family: 'Caveat', cursive;
            font-size: 4.2rem;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 242, 254, 0.5);
            margin-bottom: 20px;
            text-align: center;
            line-height: 1;
        }

        .btn {
            width: 100%;
            max-width: 270px;
            padding: 14px 20px;
            margin: 6px 0;
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            border: none;
            border-radius: 22px;
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 114, 255, 0.35);
            transition: transform 0.1s, box-shadow 0.1s;
            text-align: center;
            flex-shrink: 0;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #282d42, #141726);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255,255,255,0.12);
        }

        .btn-admin {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            box-shadow: 0 6px 20px rgba(255, 75, 43, 0.4);
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .tab-btn.active {
            background: #00f2fe;
            color: #000;
            border-color: #00f2fe;
        }

        input {
            width: 100%;
            max-width: 270px;
            padding: 12px 18px;
            margin: 8px 0;
            border-radius: 20px;
            border: 2px solid rgba(0, 242, 254, 0.5);
            background: #121526;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            text-align: center;
        }

        /* Стрелки Управления */
        #touch-controls {
            position: absolute;
            bottom: 25px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 15;
            pointer-events: none;
        }

        .touch-btn {
            width: 44%;
            height: 60px;
            background: rgba(20, 25, 45, 0.8);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(0, 242, 254, 0.4);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.05rem;
            font-weight: 800;
            color: #fff;
            pointer-events: auto;
            touch-action: manipulation;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
        }

        .touch-btn:active {
            background: rgba(0, 242, 254, 0.35);
            border-color: #00f2fe;
            transform: scale(0.96);
        }

        /* Предупреждение Босса */
        #boss-warning {
            position: absolute;
            top: 22%;
            width: 100%;
            text-align: center;
            font-family: 'Caveat', cursive;
            font-size: 3.2rem;
            color: #ff0055;
            text-shadow: 0 0 25px #ff0055;
            animation: pulse 0.5s infinite alternate;
            z-index: 12;
            pointer-events: none;
        }

        @keyframes pulse {
            from { opacity: 0.3; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1.05); }
        }

        /* Списки с прокруткой */
        .scroll-list {
            width: 100%;
            max-width: 330px;
            max-height: 32vh;
            overflow-y: auto;
            margin: 10px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 4px;
            flex-shrink: 1;
        }

        .list-item {
            background: rgba(20, 24, 42, 0.9);
            padding: 12px 16px;
            border-radius: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Canvas для превью в примерочной */
        #preview-canvas {
            width: 140px;
            height: 140px;
            background: rgba(20, 25, 45, 0.5);
            border-radius: 20px;
            border: 1px solid rgba(0, 242, 254, 0.3);
            margin-bottom: 10px;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Шапка Профиля (скрыта на старте) -->
    <div class="top-bar hidden">
        <div class="user-badge">
            <span>🧪</span>
            <div>
                <div style="display: flex; align-items: center; gap: 4px;">
                    <span id="display-name">Player</span>
                    <span id="display-badge" class="verified-icon">✔</span>
                </div>
                <span id="display-role" class="user-role">ИГРОК</span>
            </div>
        </div>

        <div class="stats-group">
            <div class="stat-chip">🪙 <span id="display-coins">0</span></div>
            <div class="stat-chip">🏆 <span id="display-record">0м</span></div>
        </div>
    </div>

    <div id="boss-warning" class="hidden">⚠️ ПОЯВИЛСЯ БОСС! ⚠️</div>

    <canvas id="gameCanvas"></canvas>

    <div id="touch-controls" class="hidden">
        <div class="touch-btn" id="btn-left">◄ Налево</div>
        <div class="touch-btn" id="btn-right">Направо ►</div>
    </div>

    <!-- Авторизация -->
    <div id="auth-screen" class="screen">
        <h1 class="game-title">Slime Jumper</h1>
        <input type="text" id="auth-nick" placeholder="Введите Ник" maxlength="15">
        <input type="password" id="auth-pass" placeholder="Введите Пароль">
        <button class="btn" id="btn-login">Войти</button>
        <button class="btn btn-secondary" id="btn-register">Зарегистрироваться</button>
    </div>

    <!-- Главное Меню -->
    <div id="menu-screen" class="screen hidden">
        <h1 class="game-title">Slime Jumper</h1>
        <button class="btn" id="btn-start">🎮 Играть</button>
        <button class="btn" id="btn-wardrobe">👕 Гардероб и Аксессуары</button>
        <button class="btn" id="btn-leaderboard">🏆 Рейтинг Игроков</button>
        <button class="btn" id="btn-settings">⚙️ Настройки</button>
        <button class="btn btn-admin hidden" id="btn-admin-panel">👑 Панель Админа</button>
    </div>

    <!-- Гардероб & Аксессуары -->
    <div id="wardrobe-screen" class="screen hidden">
        <h1 class="game-title" style="font-size: 2.5rem; margin-bottom: 5px;">Примерка</h1>
        <canvas id="preview-canvas" width="140" height="140"></canvas>
        
        <div style="display: flex; gap: 10px; width: 100%; max-width: 330px; margin-bottom: 5px;">
            <button class="tab-btn active" id="tab-skins">Скины</button>
            <button class="tab-btn" id="tab-accessories">Аксессуары</button>
        </div>

        <div class="scroll-list" id="shop-list"></div>
        <button class="btn btn-secondary" id="btn-back-wardrobe">Назад</button>
    </div>

    <!-- Рейтинг (Firebase) -->
    <div id="leaderboard-screen" class="screen hidden">
        <h1 class="game-title">Рейтинг</h1>
        <div class="scroll-list" id="leaderboard-list"></div>
        <button class="btn btn-secondary" id="btn-back-leaderboard">Назад</button>
    </div>

    <!-- Настройки -->
    <div id="settings-screen" class="screen hidden">
        <h1 class="game-title">Настройки</h1>
        <p style="font-size: 0.85rem; margin-bottom: 4px;">Сменить Никнейм:</p>
        <input type="text" id="new-nick-input" placeholder="Новый ник">
        <button class="btn" id="btn-change-nick">Сохранить ник</button>
        <br>
        <button class="btn btn-secondary" id="btn-toggle-sound">🔊 Звук: Включен</button>
        <button class="btn btn-admin" id="btn-logout">Выйти из аккаунта</button>
        <button class="btn btn-secondary" id="btn-back-settings">Назад</button>
    </div>

    <!-- Админка -->
    <div id="admin-screen" class="screen hidden">
        <h1 class="game-title">Панель Админа</h1>
        <input type="text" id="admin-target-user" placeholder="Никнейм игрока">
        <button class="btn" id="btn-admin-give-coins">+1000 Монет</button>
        <button class="btn" id="btn-admin-toggle-badge">Выдать / Снять Галочку</button>
        <button class="btn btn-secondary" id="btn-back-admin">Назад</button>
    </div>

    <!-- Конец Игры -->
    <div id="gameover-screen" class="screen hidden">
        <h1 class="game-title" style="background: linear-gradient(135deg, #ff0055, #ff5e62); -webkit-background-clip: text;">ВЫ УПАЛИ!</h1>
        <p style="font-size: 1.2rem; margin-bottom: 8px;">Высота: <span id="final-score">0</span> м</p>
        <p style="font-size: 1.2rem; margin-bottom: 25px;">Собрано монет: <span id="final-coins">0</span> 🪙</p>
        <button class="btn" id="btn-restart">🎮 Играть снова</button>
        <button class="btn btn-secondary" id="btn-to-menu">🏠 В меню</button>
    </div>
</div>

<script>
    /* --- FIREBASE ПОДКЛЮЧЕНИЕ --- */
    const firebaseConfig = {
        apiKey: "AIzaSyA9x0Zw5JzaNzp2sDs0CIF2RCh",
        authDomain: "slime-jumper-fc1e7.firebaseapp.com",
        databaseURL: "https://slime-jumper-fc1e7-default-rtdb.firebaseio.com",
        projectId: "slime-jumper-fc1e7",
        storageBucket: "slime-jumper-fc1e7.firebasestorage.app",
        messagingSenderId: "960114554230",
        appId: "1:960114554230:web:ce358062e0763"
    };

    let db = null;
    try {
        if (typeof firebase !== 'undefined') {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
        }
    } catch (e) {
        console.log("Firebase офлайн");
    }

    /* --- ЗВУКИ --- */
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    let soundEnabled = true;

    function playSound(type) {
        if (!soundEnabled) return;
        if (!audioCtx) audioCtx = new AudioCtx();

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'jump') {
            osc.frequency.setValueAtTime(180, now);
            osc.frequency.exponentialRampToValueAtTime(450, now + 0.12);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
            osc.start(now); osc.stop(now + 0.12);
        } else if (type === 'coin') {
            osc.frequency.setValueAtTime(650, now);
            osc.frequency.setValueAtTime(950, now + 0.08);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
            osc.start(now); osc.stop(now + 0.18);
        } else if (type === 'spring') {
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.linearRampToValueAtTime(680, now + 0.22);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
            osc.start(now); osc.stop(now + 0.22);
        } else if (type === 'laser') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(100, now + 0.3);
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        }
    }

    /* --- ДАННЫЕ ПОЛЬЗОВАТЕЛЯ --- */
    let localDB = JSON.parse(localStorage.getItem('slime_jumper_users')) || {
        "admin": { pass: "admin123", coins: 9999, record: 350, skin: "gold", accessory: "crown", skins: ["classic", "gold"], accessories: ["none", "crown"], isVerified: true, isAdmin: true }
    };

    let currentUser = null;

    function saveLocalDB() {
        localStorage.setItem('slime_jumper_users', JSON.stringify(localDB));
    }

    function syncUserData(username) {
        const topBar = document.querySelector('.top-bar');
        
        if (!username || !localDB[username]) {
            topBar.classList.add('hidden');
            return;
        }

        // Показываем шапку профиля после авторизации
        topBar.classList.remove('hidden');

        const u = localDB[username];
        
        document.getElementById('display-name').innerText = username;
        document.getElementById('display-coins').innerText = u.coins;
        document.getElementById('display-record').innerText = (u.record || 0) + 'м';
        
        if (u.isVerified) {
            document.getElementById('display-badge').classList.remove('hidden');
        } else {
            document.getElementById('display-badge').classList.add('hidden');
        }

        if (u.isAdmin) {
            document.getElementById('display-role').innerText = 'АДМИНИСТРАТОР';
            document.getElementById('display-role').classList.remove('hidden');
            document.getElementById('btn-admin-panel').classList.remove('hidden');
        } else {
            document.getElementById('display-role').innerText = 'ИГРОК';
            document.getElementById('btn-admin-panel').classList.add('hidden');
        }

        saveLocalDB();
        if (db) {
            try { db.ref('users/' + username).set(u); } catch(e){}
        }
        drawPreview();
    }

    /* --- СКИНЫ И АКСЕССУАРЫ --- */
    const SKINS = {
        classic: { name: "Классик", price: 0, c1: "#00f2fe", c2: "#4facfe" },
        green: { name: "Изумруд", price: 50, c1: "#00ff87", c2: "#60efff" },
        pink: { name: "Сакура", price: 100, c1: "#ff007f", c2: "#ff758c" },
        gold: { name: "Золотой", price: 250, c1: "#ffd700", c2: "#ffaa00" },
        rainbow: { name: "Радужный", price: 500, rainbow: true },
        dark: { name: "Тьма", price: 750, c1: "#3a3d52", c2: "#181a26" },
        lava: { name: "Магма", price: 1000, c1: "#ff4e00", c2: "#ec9f05" },
        galaxy: { name: "Космос", price: 1500, c1: "#8a2be2", c2: "#4a00e0" },
        neon: { name: "Неон", price: 2000, c1: "#00ffff", c2: "#0088ff" },
        diamond: { name: "Алмаз", price: 3000, c1: "#e0f7fa", c2: "#80deea" },
        toxic: { name: "Токсик", price: 4500, c1: "#39ff14", c2: "#00b300" },
        ghost: { name: "Призрак", price: 6000, c1: "rgba(255,255,255,0.8)", c2: "rgba(200,220,255,0.4)" }
    };

    const ACCESSORIES = {
        none: { name: "Без аксессуара", price: 0 },
        crown: { name: "Корона", price: 200 },
        headphones: { name: "Наушники", price: 300 },
        glasses: { name: "Очки", price: 250 },
        halo: { name: "Нимб", price: 400 },
        cat_ears: { name: "Кошачьи ушки", price: 350 },
        bow: { name: "Бантик", price: 150 },
        cap: { name: "Кепка", price: 300 }
    };

    /* --- ОТРИСОВКА СЛАЙМА И АКСЕССУАРОВ --- */
    function drawSlime(ctx, x, y, radius, skinKey, accKey, scaleX = 1, scaleY = 1) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scaleX, scaleY);

        let s = SKINS[skinKey] || SKINS.classic;

        // Тело Слайма
        let grad = ctx.createRadialGradient(-radius*0.3, -radius*0.3, radius*0.1, 0, 0, radius * 1.2);
        if (s.rainbow) {
            let hue = (Date.now() / 10) % 360;
            grad.addColorStop(0, `hsl(${hue}, 100%, 65%)`);
            grad.addColorStop(1, `hsl(${hue}, 100%, 35%)`);
        } else {
            grad.addColorStop(0, s.c1);
            grad.addColorStop(1, s.c2);
        }

        ctx.fillStyle = grad;
        ctx.shadowBlur = 18;
        ctx.shadowColor = s.c1 || '#00f2fe';

        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.fill();

        // Блик
        ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
        ctx.beginPath();
        ctx.ellipse(-radius * 0.35, -radius * 0.35, radius * 0.35, radius * 0.2, Math.PI / 4, 0, Math.PI * 2);
        ctx.fill();

        // Глаза
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(-radius * 0.28, -radius * 0.1, radius * 0.25, 0, Math.PI * 2);
        ctx.arc(radius * 0.28, -radius * 0.1, radius * 0.25, 0, Math.PI * 2);
        ctx.fill();

        // Зрачки
        ctx.fillStyle = '#0f111a';
        ctx.beginPath();
        ctx.arc(-radius * 0.22, -radius * 0.08, radius * 0.12, 0, Math.PI * 2);
        ctx.arc(radius * 0.34, -radius * 0.08, radius * 0.12, 0, Math.PI * 2);
        ctx.fill();

        // Блики в глазах
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(-radius * 0.25, -radius * 0.12, radius * 0.05, 0, Math.PI * 2);
        ctx.arc(radius * 0.31, -radius * 0.12, radius * 0.05, 0, Math.PI * 2);
        ctx.fill();

        // Улыбка
        ctx.strokeStyle = '#0f111a';
        ctx.lineWidth = radius * 0.08;
        ctx.beginPath();
        ctx.arc(0, radius * 0.1, radius * 0.25, 0.15 * Math.PI, 0.85 * Math.PI);
        ctx.stroke();

        /* --- АКСЕССУАРЫ --- */
        if (accKey === 'crown') {
            ctx.fillStyle = '#ffd700';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ffd700';
            ctx.beginPath();
            let topY = -radius * 0.85;
            ctx.moveTo(-radius * 0.5, topY);
            ctx.lineTo(-radius * 0.6, topY - radius * 0.5);
            ctx.lineTo(-radius * 0.2, topY - radius * 0.25);
            ctx.lineTo(0, topY - radius * 0.6);
            ctx.lineTo(radius * 0.2, topY - radius * 0.25);
            ctx.lineTo(radius * 0.6, topY - radius * 0.5);
            ctx.lineTo(radius * 0.5, topY);
            ctx.closePath();
            ctx.fill();
        } 
        else if (accKey === 'headphones') {
            ctx.strokeStyle = '#ff0055';
            ctx.lineWidth = radius * 0.18;
            ctx.beginPath();
            ctx.arc(0, 0, radius * 1.08, Math.PI * 1.1, Math.PI * 1.9);
            ctx.stroke();

            ctx.fillStyle = '#ff0055';
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#ff0055';
            ctx.beginPath();
            ctx.roundRect(-radius * 1.15, -radius * 0.3, radius * 0.28, radius * 0.6, 6);
            ctx.roundRect(radius * 0.87, -radius * 0.3, radius * 0.28, radius * 0.6, 6);
            ctx.fill();
        } 
        else if (accKey === 'glasses') {
            ctx.fillStyle = '#111';
            ctx.strokeStyle = '#00f2fe';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(-radius * 0.28, -radius * 0.1, radius * 0.3, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();
            ctx.beginPath();
            ctx.arc(radius * 0.28, -radius * 0.1, radius * 0.3, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(-radius * 0.02, -radius * 0.1);
            ctx.lineTo(radius * 0.02, -radius * 0.1);
            ctx.stroke();
        }
        else if (accKey === 'halo') {
            ctx.strokeStyle = '#fff700';
            ctx.lineWidth = 4;
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#fff700';
            ctx.beginPath();
            ctx.ellipse(0, -radius * 1.35, radius * 0.65, radius * 0.2, 0, 0, Math.PI * 2);
            ctx.stroke();
        }
        else if (accKey === 'cat_ears') {
            ctx.fillStyle = '#ff758c';
            ctx.beginPath();
            ctx.moveTo(-radius * 0.8, -radius * 0.4);
            ctx.lineTo(-radius * 0.5, -radius * 1.25);
            ctx.lineTo(-radius * 0.1, -radius * 0.85);
            ctx.moveTo(radius * 0.8, -radius * 0.4);
            ctx.lineTo(radius * 0.5, -radius * 1.25);
            ctx.lineTo(radius * 0.1, -radius * 0.85);
            ctx.fill();
        }
        else if (accKey === 'bow') {
            ctx.fillStyle = '#ff0055';
            let bx = radius * 0.5, by = -radius * 0.75;
            ctx.beginPath();
            ctx.moveTo(bx, by);
            ctx.lineTo(bx + 12, by - 8);
            ctx.lineTo(bx + 12, by + 8);
            ctx.closePath();
            ctx.moveTo(bx, by);
            ctx.lineTo(bx - 12, by - 8);
            ctx.lineTo(bx - 12, by + 8);
            ctx.closePath();
            ctx.fill();
            ctx.beginPath();
            ctx.arc(bx, by, 4, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();
        }
        else if (accKey === 'cap') {
            ctx.fillStyle = '#0072ff';
            ctx.beginPath();
            ctx.arc(0, -radius * 0.7, radius * 0.55, Math.PI, 0);
            ctx.fill();
            ctx.fillRect(-radius * 0.8, -radius * 0.7, radius * 1.1, 5);
        }

        ctx.restore();
    }

    // Отрисовка превью в гардеробе
    const prevCanvas = document.getElementById('preview-canvas');
    const prevCtx = prevCanvas.getContext('2d');
    function drawPreview() {
        if (!prevCtx) return;
        prevCtx.clearRect(0, 0, prevCanvas.width, prevCanvas.height);
        if (!currentUser || !localDB[currentUser]) return;
        const u = localDB[currentUser];
        drawSlime(prevCtx, 70, 78, 36, u.skin || 'classic', u.accessory || 'none');
    }

    /* --- CANVAS ДЛЯ ИГРЫ --- */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let gameState = 'AUTH';
    let cameraY = 0;
    let score = 0;
    let sessionCoins = 0;

    const player = { x: 200, y: 400, radius: 20, vx: 0, vy: 0, scaleX: 1, scaleY: 1 };
    let platforms = [];
    let coins = [];

    const boss = { active: false, x: 0, y: -100, laserTimer: 0, isAiming: false, isShooting: false, laserX: 0 };
    const keys = { left: false, right: false };

    window.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
    });
    window.addEventListener('keyup', e => {
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
    });

    const bindTouch = (btn, key) => {
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
        btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
        btn.addEventListener('mousedown', () => keys[key] = true);
        btn.addEventListener('mouseup', () => keys[key] = false);
    };
    bindTouch(document.getElementById('btn-left'), 'left');
    bindTouch(document.getElementById('btn-right'), 'right');

    function initGame() {
        score = 0; sessionCoins = 0; cameraY = 0;
        player.x = canvas.width / 2;
        player.y = canvas.height - 120;
        player.vx = 0; player.vy = -11.5;

        platforms = []; coins = [];
        platforms.push({ x: canvas.width / 2 - 45, y: canvas.height - 40, w: 90, h: 14, type: 'normal' });
        
        for (let y = canvas.height - 110; y > -10000; y -= 65 + Math.random() * 25) {
            let type = 'normal';
            let rand = Math.random();
            if (rand < 0.22) type = 'moving';
            else if (rand < 0.32) type = 'spring';

            let x = Math.random() * (canvas.width - 85);
            platforms.push({ x, y, w: 85, h: 14, type, vx: type === 'moving' ? (Math.random() > 0.5 ? 2.2 : -2.2) : 0 });
            if (Math.random() < 0.35) coins.push({ x: x + 42, y: y - 22, collected: false });
        }

        boss.active = false; boss.laserTimer = 0; boss.isShooting = false; boss.isAiming = false;
        document.getElementById('boss-warning').classList.add('hidden');
        gameState = 'GAME';
        document.getElementById('touch-controls').classList.remove('hidden');
    }

    function update() {
        if (gameState !== 'GAME') return;

        if (keys.left) player.vx = -6.5;
        else if (keys.right) player.vx = 6.5;
        else player.vx *= 0.82;

        player.x += player.vx;
        player.vy += 0.42;
        player.y += player.vy;

        if (player.x < -player.radius) player.x = canvas.width + player.radius;
        if (player.x > canvas.width + player.radius) player.x = -player.radius;

        if (player.y - cameraY < canvas.height * 0.45) {
            let diff = (canvas.height * 0.45) - (player.y - cameraY);
            cameraY -= diff;
            score = Math.floor(-cameraY / 10);
        }

        if (player.vy > 0) {
            platforms.forEach(p => {
                if (player.x > p.x - 10 && player.x < p.x + p.w + 10 &&
                    player.y + player.radius >= p.y && player.y + player.radius <= p.y + p.h + 8) {
                    
                    if (p.type === 'spring') {
                        player.vy = -17.5;
                        playSound('spring');
                    } else {
                        player.vy = -11.5;
                        playSound('jump');
                    }
                    player.scaleX = 1.3;
                    player.scaleY = 0.7;
                }
            });
        }

        platforms.forEach(p => {
            if (p.type === 'moving') {
                p.x += p.vx;
                if (p.x <= 5 || p.x + p.w >= canvas.width - 5) p.vx *= -1;
            }
        });

        coins.forEach(c => {
            if (!c.collected && Math.hypot(player.x - c.x, player.y - c.y) < player.radius + 12) {
                c.collected = true;
                sessionCoins++;
                playSound('coin');
            }
        });

        // Битва с Боссом
        if (score >= 100) {
            if (!boss.active) {
                boss.active = true;
                document.getElementById('boss-warning').classList.remove('hidden');
                setTimeout(() => document.getElementById('boss-warning').classList.add('hidden'), 2000);
            }

            boss.y += (cameraY + 90 - boss.y) * 0.06;
            boss.x = canvas.width / 2;

            boss.laserTimer++;
            if (boss.laserTimer > 160 && !boss.isAiming && !boss.isShooting) {
                boss.isAiming = true;
                boss.laserX = player.x;
                setTimeout(() => {
                    if (boss.active) {
                        boss.isAiming = false;
                        boss.isShooting = true;
                        playSound('laser');
                        if (Math.abs(player.x - boss.laserX) < 28) gameOver();
                        setTimeout(() => { boss.isShooting = false; boss.laserTimer = 0; }, 450);
                    }
                }, 900);
            }
        }

        if (player.y - cameraY > canvas.height + 60) gameOver();
    }

    function gameOver() {
        gameState = 'GAMEOVER';
        document.getElementById('touch-controls').classList.add('hidden');
        document.getElementById('final-score').innerText = score;
        document.getElementById('final-coins').innerText = sessionCoins;

        if (currentUser && localDB[currentUser]) {
            localDB[currentUser].coins += sessionCoins;
            if (score > (localDB[currentUser].record || 0)) {
                localDB[currentUser].record = score;
            }
            syncUserData(currentUser);
        }
        document.getElementById('gameover-screen').classList.remove('hidden');
    }

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.translate(0, -cameraY);

        // Платформы
        platforms.forEach(p => {
            ctx.fillStyle = p.type === 'spring' ? '#ff007f' : (p.type === 'moving' ? '#00f2fe' : '#00ff87');
            ctx.shadowBlur = 12;
            ctx.shadowColor = ctx.fillStyle;
            ctx.beginPath();
            ctx.roundRect(p.x, p.y, p.w, p.h, 7);
            ctx.fill();
            if (p.type === 'spring') {
                ctx.fillStyle = '#fff';
                ctx.fillRect(p.x + p.w / 2 - 10, p.y - 4, 20, 4);
            }
        });

        // Монеты
        coins.forEach(c => {
            if (c.collected) return;
            ctx.fillStyle = '#ffd700';
            ctx.shadowBlur = 14;
            ctx.shadowColor = '#ffd700';
            ctx.beginPath();
            ctx.arc(c.x, c.y, 8, 0, Math.PI * 2);
            ctx.fill();
        });

        // Босс
        if (boss.active) {
            ctx.save();
            ctx.translate(boss.x, boss.y);
            ctx.fillStyle = '#ff0055';
            ctx.shadowBlur = 30;
            ctx.shadowColor = '#ff0055';
            ctx.beginPath();
            ctx.arc(0, 0, 45, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(0, 0, 16, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(0, 0, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            if (boss.isAiming) {
                ctx.strokeStyle = 'rgba(255, 0, 85, 0.5)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(boss.laserX, boss.y);
                ctx.lineTo(boss.laserX, cameraY + canvas.height);
                ctx.stroke();
            }

            if (boss.isShooting) {
                ctx.strokeStyle = '#ff0055';
                ctx.lineWidth = 32;
                ctx.shadowBlur = 35;
                ctx.shadowColor = '#ff007f';
                ctx.beginPath();
                ctx.moveTo(boss.laserX, boss.y);
                ctx.lineTo(boss.laserX, cameraY + canvas.height);
                ctx.stroke();
            }
        }

        // Отрисовка игрока
        player.scaleX += (1 - player.scaleX) * 0.12;
        player.scaleY += (1 - player.scaleY) * 0.12;
        const u = localDB[currentUser] || {};
        drawSlime(ctx, player.x, player.y, player.radius, u.skin || 'classic', u.accessory || 'none', player.scaleX, player.scaleY);

        ctx.restore();

        if (gameState === 'GAME') {
            ctx.fillStyle = '#fff';
            ctx.font = '700 1.1rem Comfortaa';
            ctx.fillText(`📏 ${score} м`, 20, 80);
            ctx.fillText(`🪙 ${sessionCoins}`, canvas.width - 80, 80);
        }
    }

    function gameLoop() {
        update();
        render();
        requestAnimationFrame(gameLoop);
    }

    /* --- ЛОГИКА ЭКРАНОВ И АВТОРИЗАЦИИ --- */
    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
        if (id) document.getElementById(id).classList.remove('hidden');
    }

    document.getElementById('btn-login').addEventListener('click', () => {
        const nick = document.getElementById('auth-nick').value.trim();
        const pass = document.getElementById('auth-pass').value.trim();
        if (!nick || !pass) return alert('Заполните все поля!');

        if (localDB[nick]) {
            if (localDB[nick].pass === pass) {
                currentUser = nick;
                syncUserData(currentUser);
                showScreen('menu-screen');
            } else alert('Неверный пароль!');
        } else alert('Игрок не найден. Нажмите "Зарегистрироваться"');
    });

    document.getElementById('btn-register').addEventListener('click', () => {
        const nick = document.getElementById('auth-nick').value.trim();
        const pass = document.getElementById('auth-pass').value.trim();
        if (!nick || !pass) return alert('Заполните все поля!');

        if (localDB[nick]) return alert('Имя уже занято!');

        localDB[nick] = {
            pass, coins: 0, record: 0, skin: 'classic', accessory: 'none',
            skins: ['classic'], accessories: ['none'], isVerified: false, isAdmin: false
        };
        currentUser = nick;
        syncUserData(currentUser);
        showScreen('menu-screen');
    });

    document.getElementById('btn-start').addEventListener('click', () => { showScreen(null); initGame(); });
    document.getElementById('btn-restart').addEventListener('click', () => { document.getElementById('gameover-screen').classList.add('hidden'); initGame(); });
    document.getElementById('btn-to-menu').addEventListener('click', () => showScreen('menu-screen'));

    /* --- ГАРДЕРОб С ВКЛАДКАМИ --- */
    let currentTab = 'skins';
    document.getElementById('tab-skins').addEventListener('click', () => {
        currentTab = 'skins';
        document.getElementById('tab-skins').classList.add('active');
        document.getElementById('tab-accessories').classList.remove('active');
        renderShop();
    });
    document.getElementById('tab-accessories').addEventListener('click', () => {
        currentTab = 'accessories';
        document.getElementById('tab-accessories').classList.add('active');
        document.getElementById('tab-skins').classList.remove('active');
        renderShop();
    });

    function renderShop() {
        const list = document.getElementById('shop-list');
        list.innerHTML = '';
        const user = localDB[currentUser];
        if (!user) return;

        if (currentTab === 'skins') {
            Object.keys(SKINS).forEach(key => {
                const item = SKINS[key];
                const isBought = user.skins.includes(key);
                const isEquipped = user.skin === key;

                const div = document.createElement('div');
                div.className = 'list-item';
                div.innerHTML = `
                    <div>
                        <strong>${item.name}</strong><br>
                        <small style="color:#aaa;">${isBought ? 'Куплено' : item.price + ' 🪙'}</small>
                    </div>
                    <button class="btn" style="width:auto; padding:8px 14px; margin:0; font-size:0.85rem;">
                        ${isEquipped ? 'Надет' : (isBought ? 'Надеть' : 'Купить')}
                    </button>
                `;
                div.querySelector('button').addEventListener('click', () => {
                    if (isBought) user.skin = key;
                    else if (user.coins >= item.price) {
                        user.coins -= item.price;
                        user.skins.push(key);
                        user.skin = key;
                    } else return alert('Недостаточно монет!');
                    syncUserData(currentUser);
                    drawPreview();
                    renderShop();
                });
                list.appendChild(div);
            });
        } else {
            Object.keys(ACCESSORIES).forEach(key => {
                const item = ACCESSORIES[key];
                const isBought = user.accessories.includes(key);
                const isEquipped = user.accessory === key;

                const div = document.createElement('div');
                div.className = 'list-item';
                div.innerHTML = `
                    <div>
                        <strong>${item.name}</strong><br>
                        <small style="color:#aaa;">${isBought ? 'Куплено' : item.price + ' 🪙'}</small>
                    </div>
                    <button class="btn" style="width:auto; padding:8px 14px; margin:0; font-size:0.85rem;">
                        ${isEquipped ? 'Надет' : (isBought ? 'Надеть' : 'Купить')}
                    </button>
                `;
                div.querySelector('button').addEventListener('click', () => {
                    if (isBought) user.accessory = key;
                    else if (user.coins >= item.price) {
                        user.coins -= item.price;
                        user.accessories.push(key);
                        user.accessory = key;
                    } else return alert('Недостаточно монет!');
                    syncUserData(currentUser);
                    drawPreview();
                    renderShop();
                });
                list.appendChild(div);
            });
        }
    }

    document.getElementById('btn-wardrobe').addEventListener('click', () => {
        renderShop();
        drawPreview();
        showScreen('wardrobe-screen');
    });
    document.getElementById('btn-back-wardrobe').addEventListener('click', () => showScreen('menu-screen'));

    /* --- РЕЙТИНГ ИЗ FIREBASE --- */
    document.getElementById('btn-leaderboard').addEventListener('click', () => {
        const list = document.getElementById('leaderboard-list');
        list.innerHTML = '<div style="text-align:center;">Загрузка игроков из сети...</div>';

        const displayPlayers = (data) => {
            list.innerHTML = '';
            if (!data) return list.innerHTML = '<div style="text-align:center;">Игроков пока нет</div>';

            let players = Object.keys(data).map(k => ({ name: k, ...data[k] }))
                                        .sort((a,b) => (b.record || 0) - (a.record || 0));

            players.forEach((u, idx) => {
                const div = document.createElement('div');
                div.className = 'list-item';
                div.innerHTML = `
                    <div style="display:flex; align-items:center; gap: 8px;">
                        <span style="font-weight:800; color:#00f2fe;">#${idx + 1}</span>
                        <strong>${u.name}</strong>
                        ${u.isVerified ? '<span class="verified-icon">✔</span>' : ''}
                    </div>
                    <div><strong style="color:#ffd700;">${u.record || 0} м</strong></div>
                `;
                list.appendChild(div);
            });
        };

        if (db) {
            db.ref('users').once('value')
                .then(snap => displayPlayers(snap.val() || localDB))
                .catch(() => displayPlayers(localDB));
        } else {
            displayPlayers(localDB);
        }

        showScreen('leaderboard-screen');
    });

    document.getElementById('btn-back-leaderboard').addEventListener('click', () => showScreen('menu-screen'));

    // Настройки & Админка
    document.getElementById('btn-settings').addEventListener('click', () => {
        document.getElementById('new-nick-input').value = currentUser;
        showScreen('settings-screen');
    });
    document.getElementById('btn-change-nick').addEventListener('click', () => {
        const newNick = document.getElementById('new-nick-input').value.trim();
        if (!newNick || newNick === currentUser) return;
        if (localDB[newNick]) return alert('Имя уже занято!');
        localDB[newNick] = localDB[currentUser];
        delete localDB[currentUser];
        currentUser = newNick;
        syncUserData(currentUser);
        alert('Никнейм изменен!');
    });
    document.getElementById('btn-toggle-sound').addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        document.getElementById('btn-toggle-sound').innerText = `🔊 Звук: ${soundEnabled ? 'Включен' : 'Выключен'}`;
    });
    document.getElementById('btn-logout').addEventListener('click', () => {
        currentUser = null;
        document.querySelector('.top-bar').classList.add('hidden');
        showScreen('auth-screen');
    });
    document.getElementById('btn-back-settings').addEventListener('click', () => showScreen('menu-screen'));
    document.getElementById('btn-admin-panel').addEventListener('click', () => showScreen('admin-screen'));
    document.getElementById('btn-back-admin').addEventListener('click', () => showScreen('menu-screen'));

    document.getElementById('btn-admin-give-coins').addEventListener('click', () => {
        const t = document.getElementById('admin-target-user').value.trim();
        if (localDB[t]) { localDB[t].coins += 1000; syncUserData(currentUser); alert('+1000 монет выдано игроку ' + t); }
    });
    document.getElementById('btn-admin-toggle-badge').addEventListener('click', () => {
        const t = document.getElementById('admin-target-user').value.trim();
        if (localDB[t]) { localDB[t].isVerified = !localDB[t].isVerified; syncUserData(currentUser); alert('Галочка изменена игроку ' + t); }
    });

    requestAnimationFrame(gameLoop);
</script>
